name: CI

# Checks every pull request, and every push to main as the first stage of
# deploy-ui.yml, which publishes the UI built here. The language models never
# run here: Ollama would need a 4.7 GB model on a CPU, and Gemini a key, its
# daily quota and answers that change from run to run. What runs is what needs
# neither: the type-check, the rules against their published results, the UI
# and the Docker image.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Type-check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  ui:
    name: UI data and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The UI reads public/data/results.json, generated by hand from
      # results/test-1.md and data/test/: regenerated here, it must not change.
      - name: Check that the UI data matches the results
        run: |
          node scripts/import.mjs
          git diff --exit-code public/data/results.json
      - run: npm ci
      - run: npm run build
      # On main, the build checked here is the one deploy-ui.yml publishes:
      # built once, not rebuilt for the deploy.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ui/dist

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag email-triage .
