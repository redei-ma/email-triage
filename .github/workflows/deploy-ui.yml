name: Deploy the UI to GitHub Pages

# On every push to main: runs CI (ci.yml), and only if it passes publishes
# the UI that CI built and checked. The language models never run here: the
# UI shows the committed results, and its Try it tab runs only the rules, in
# the browser.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
